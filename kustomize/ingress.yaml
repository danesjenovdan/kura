apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kura
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - kura.djnd.si
        - kura.danesjenovdan.si
      secretName: kura-tls
  rules:
    - host: kura.djnd.si
      http: &http_paths
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kura
                port:
                  number: 80
    - host: kura.danesjenovdan.si
      http: *http_paths
