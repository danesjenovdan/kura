apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zicar-en
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/configuration-snippet: |
      rewrite ^(/en)$ $1/ redirect; # add trailing slash
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - zicar.djnd.si
        - zicar.danesjenovdan.si
      secretName: zicar-en-tls
  rules:
    - host: zicar.djnd.si
      http:
        paths:
          - path: /en(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: zicar-en
                port:
                  number: 80
    - host: zicar.danesjenovdan.si
      http:
        paths:
          - path: /en(/|$)(.*)
            pathType: Prefix
            backend:
              service:
                name: zicar-en
                port:
                  number: 80
