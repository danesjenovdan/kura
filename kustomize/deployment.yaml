apiVersion: apps/v1
kind: Deployment
metadata:
  name: kura
  labels:
    app: kura
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kura
  template:
    metadata:
      labels:
        app: kura
    spec:
      containers:
        - name: kura
          image: kura
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 100Mi
              cpu: 100m
            limits:
              memory: 100Mi
              cpu: 100m
